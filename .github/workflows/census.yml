name: Extension content census (admin panel)
# Loads every catalog extension on desktop Java and counts the titles on its Home page; the
# CloudXtream admin panel reads the result from the "census" branch.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'
      - name: Count the content of every extension
        timeout-minutes: 30
        run: gradle --no-daemon :app:census -Pout="$PWD/census.json"
      - name: Publish to the census branch
        run: |
          set -euo pipefail
          test -s census.json
          git clone -q --depth 1 -b census "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out 2>/dev/null \
            || { git init -q -b census out; git -C out remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          cp census.json out/census.json
          cd out
          git config user.name YumAbd
          git config user.email 92353848+YumAbd@users.noreply.github.com
          git add census.json
          git commit -q -m "Content census" || exit 0
          git push -q origin census
