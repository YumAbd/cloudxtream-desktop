name: Windows app - build (and release on a tag)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['phase0/**', 'scripts/**', '**.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.0.0); empty = build only
        default: ''

permissions:
  contents: write

env:
  VLC_VERSION: 3.0.21

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'
      - name: VLC for the installer (libVLC + plugins, no VLC interface)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o vlc.zip "https://download.videolan.org/pub/videolan/vlc/${VLC_VERSION}/win64/vlc-${VLC_VERSION}-win64.zip"
          7z x -y -bso0 vlc.zip -ovlc-unpacked
          src="$(find vlc-unpacked -mindepth 1 -maxdepth 1 -type d -name 'vlc-*' | head -n 1)"
          dest=app/resources/windows/vlc
          mkdir -p "$dest"
          cp "$src/libvlc.dll" "$src/libvlccore.dll" "$dest/"
          cp -r "$src/plugins" "$dest/"
          # Not used by an embedded player.
          rm -rf "$dest/plugins/gui" "$dest/plugins/visualization" "$dest/plugins/lua" "$dest/plugins/control" "$dest/plugins/services_discovery"
          du -sh "$dest"
      - name: Smoke test - extensions and the bundled libVLC play a real video
        shell: bash
        continue-on-error: true
        run: gradle --no-daemon :app:smokeTest -PvlcDir="$PWD/app/resources/windows/vlc"
      - name: Publish the smoke test frame (screenshots branch)
        if: always()
        shell: bash
        run: |
          [ -f app/build/smoke-frame.png ] || exit 0
          git clone -q --depth 1 -b screenshots "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots 2>/dev/null \
            || { git init -q -b screenshots shots; git -C shots remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          cp app/build/smoke-frame.png shots/smoke-frame.png
          cd shots
          git config user.name YumAbd
          git config user.email 92353848+YumAbd@users.noreply.github.com
          git add smoke-frame.png
          git commit -q -m "Smoke test frame ${GITHUB_SHA::7}" || exit 0
          git push -q origin screenshots
      - name: Version
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          [[ -z "$tag" && "$GITHUB_REF" == refs/tags/v* ]] && tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the installers
        shell: bash
        run: gradle --no-daemon -PappVersion=${{ steps.version.outputs.version }} :app:packageMsi :app:packageExe
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp app/build/compose/binaries/main/msi/*.msi "dist/CloudXtream-${{ steps.version.outputs.version }}.msi"
          cp app/build/compose/binaries/main/exe/*.exe "dist/CloudXtream-${{ steps.version.outputs.version }}-setup.exe"
          ls -la dist
          sha256sum dist/* | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: cloudxtream-windows
          path: dist
          retention-days: 14
      - name: Publish the release
        if: steps.version.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > notes.md <<NOTES
          ## CloudXtream untuk Windows ${TAG}

          **Cara pasang:** muat turun **CloudXtream-${{ steps.version.outputs.version }}-setup.exe**, buka, dan ikut arahan.
          Jika Windows SmartScreen memaparkan amaran, tekan **More info → Run anyway** (installer belum ditandatangani).

          Selepas dipasang, buka CloudXtream dan masukkan **PIN pengaktifan daripada admin CloudXtream**
          (PC ini dikira sebagai satu peranti dalam lesen anda).

          - Windows 10/11 (64-bit). VLC sudah disertakan: tiada perisian lain perlu dipasang.
          - Extension sama seperti app Android, dikemas kini secara automatik daripada katalog CloudXtream.
          - Versi baharu dipaparkan dalam app dan boleh dipasang terus.
          NOTES
          gh release create "$TAG" dist/* --title "CloudXtream untuk Windows $TAG" --notes-file notes.md --target "$GITHUB_SHA"
